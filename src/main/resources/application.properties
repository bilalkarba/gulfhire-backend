spring.application.name=gulfhire-backend

# ============================================================
# SECURITY — NO SECRETS HARDCODED.
# All credentials are injected from the environment.
#
# Required env vars:
#   DB_USERNAME, DB_PASSWORD, JWT_SECRET_KEY,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#
# Setup instructions: see ENV.md  (copy .env.example to .env).
#
# A local `.env` file is loaded automatically if present — from either
# the current working directory (`./.env`) or the backend folder
# (`./gulfhire-backend/.env`), so the app works whether it is launched
# from the IDE (project root) or from the `gulfhire-backend` directory.
# Real OS/IDE environment variables always take precedence over `.env`.
# ============================================================
spring.config.import=optional:file:./.env[.properties],optional:file:./gulfhire-backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gulfhire_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Pagination (Spring Data Web) — default page size 10, max 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=86400000
security.jwt.refresh-token-expiration=604800000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload Limits (profile pictures, CVs, video CVs)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# EMAIL (JavaMailSender) — all values come from the environment.
#   MAIL_ENABLED=false (default) → sending is a no-op, so the app
#   runs fine without an SMTP server. Set MAIL_ENABLED=true and
#   provide MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD
#   to activate. See ENV.md.
# ============================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@gulfhire.com}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}