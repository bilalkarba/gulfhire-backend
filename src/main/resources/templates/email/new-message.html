<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New message</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;">

    <th:block th:replace="~{fragments :: header}"></th:block>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:40px 24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #e2e8f0;">
                    <tr>
                        <td style="padding:36px 32px;">
                            <div style="width:56px;height:56px;border-radius:50%;background-color:#dbeafe;display:inline-block;text-align:center;line-height:56px;font-size:28px;">💬</div>
                            <h1 style="font-family:Arial,Helvetica,sans-serif;font-size:22px;color:#0f172a;margin:20px 0 8px;">
                                New message from <span th:text="${senderName}">Ahmed</span>
                            </h1>
                            <p style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#334155;line-height:1.6;margin:0 0 6px;">
                                Hi <span th:text="${recipientName}">Sarah</span>, you have a new message:
                            </p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;border-left:4px solid #0ea5e9;border-radius:8px;margin:16px 0 24px;">
                                <tr>
                                    <td style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#334155;line-height:1.6;font-style:italic;"
                                        th:text="${messagePreview}">
                                        "Hi! I'd love to discuss the role with you."
                                    </td>
                                </tr>
                            </table>
                            <a href="http://localhost:4200/chat"
                               style="display:inline-block;background-color:#0ea5e9;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;text-decoration:none;padding:14px 32px;border-radius:8px;">
                                Open the conversation
                            </a>
                            <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;margin:24px 0 0;">
                                If the button doesn't work, copy and paste this link into your browser:<br />
                                http://localhost:4200/chat
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <th:block th:replace="~{fragments :: footer}"></th:block>

</body>
</html>
